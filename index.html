<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ម៉ារីយ៉ា បោះដុំ សំលៀកបំពាក់</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kantumruy Pro', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

  <!-- Header Section -->
  <header class="bg-white p-4 shadow-sm text-center max-w-md mx-auto relative">
    <div class="flex items-center justify-center gap-3">
      <a href="https://www.facebook.com/mariya.fashion168" target="_blank">
        <img src="logo.jpg" alt="Logo" class="w-14 h-14 rounded-full border object-cover">
      </a>
      <div class="text-left">
        <a href="https://www.facebook.com/mariya.fashion168" target="_blank" class="hover:underline">
          <h1 class="text-lg font-bold text-red-600 leading-tight">ម៉ារីយ៉ា បោះដុំ សំលៀកបំពាក់</h1>
        </a>
        <p class="text-xs text-gray-500">បោះដុំសំលៀកបំពាក់ កាត់ពីរោងចក្រផ្ទាល់</p>

        <div class="flex items-center gap-3 mt-1.5 text-sm">
          <a href="https://www.facebook.com/mariya.fashion168" target="_blank" class="text-blue-600"><i class="fa-brands fa-square-facebook text-xl"></i></a>
          <a href="https://t.me/+85599706595" target="_blank" class="text-sky-500"><i class="fa-brands fa-telegram text-xl"></i></a>
          <a href="tel:099706595" class="flex items-center gap-1 font-bold text-gray-800 text-xs">
            <i class="fa-solid fa-phone text-red-500"></i>
            <span>099706595</span>
          </a>
        </div>
      </div>
    </div>
    
    <nav class="flex justify-between items-center text-xs mt-4 pt-2 border-t font-semibold text-gray-700">
      <button onclick="filterCategory('all')" id="cat-all" class="text-blue-600 underline font-bold">ទាំងអស់</button>
      <span>|</span>
      <button onclick="filterCategory('women')" id="cat-women" class="hover:text-blue-600 font-semibold">ខោអាវនារី</button>
      <span>|</span>
      <button onclick="filterCategory('men')" id="cat-men" class="hover:text-blue-600 font-semibold">ខោអាវបុរស</button>
      <span>|</span>
      <button onclick="filterCategory('kids')" id="cat-kids" class="hover:text-blue-600 font-semibold">ខោអាវក្មេង</button>
      <span>|</span>
      <button id="auth-btn" onclick="handleAuthAction()" class="bg-blue-600 text-white px-2 py-1 rounded">Login</button>
    </nav>
  </header>

  <!-- Product Grid -->
  <main class="max-w-md mx-auto p-3">
    <div id="product-list" class="grid grid-cols-2 gap-3"></div>
  </main>

  <!-- Image Enlarge Modal -->
  <div id="image-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50 select-none" onclick="closeImageModal()">
    <div class="relative max-w-sm w-full bg-white p-2 rounded-lg shadow-2xl flex items-center justify-center overflow-hidden" onclick="event.stopPropagation()">
      <button onclick="closeImageModal()" class="absolute top-2 right-2 bg-red-600 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center z-20 shadow">✕</button>
      
      <button id="modal-prev-btn" onclick="prevModalImage()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center text-base hover:bg-black/80 z-20">❮</button>
      <button id="modal-next-btn" onclick="nextModalImage()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center text-base hover:bg-black/80 z-20">❯</button>

      <div id="modal-touch-area" class="w-full flex flex-col items-center">
        <img id="enlarged-img" src="" class="w-full h-auto rounded object-contain max-h-[75vh] transition-all duration-200">
        <p id="modal-img-counter" class="text-xs text-gray-500 mt-2 font-medium"></p>
      </div>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-5 rounded-lg w-full max-w-xs text-center shadow-lg">
      <h3 class="text-base font-bold mb-3">ចូលប្រើប្រាស់ជា Admin</h3>
      <input type="email" id="admin-email" placeholder="អ៊ីមែល (Email)..." class="border p-2 w-full rounded mb-2 text-sm border-gray-300 outline-none">
      <input type="password" id="admin-pass" placeholder="ពាក្យសម្ងាត់ (Password)..." class="border p-2 w-full rounded mb-3 text-sm border-gray-300 outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal()" class="px-3 py-1 text-xs bg-gray-300 rounded">បោះបង់</button>
        <button onclick="verifyAdmin()" id="login-btn-submit" class="px-3 py-1 text-xs bg-blue-600 text-white rounded">ចូល</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK & Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClzkcK4w6kMTfCdUNWxFNhB4wTrhoOquo",
      authDomain: "mariya-website.firebaseapp.com",
      databaseURL: "https://mariya-website-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mariya-website",
      storageBucket: "mariya-website.firebasestorage.app",
      messagingSenderId: "751144030956",
      appId: "1:751144030956:web:3b0ceebcf1ef41a4380bc9",
      measurementId: "G-RH6MF94XPT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const IMGBB_API_KEY = "7e51fdb1c14c7e8e33f76c98d9177408";

    window.isAdmin = false;
    window.currentCategory = "all";
    window.isUploadingMap = {}; 
    let productsList = [];
    window.activeImgIndices = {};

    let currentModalProductId = null;
    let currentModalImgIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.isAdmin = true;
        document.getElementById("auth-btn").innerText = "Logout (Admin)";
        document.getElementById("auth-btn").className = "bg-red-600 text-white px-2 py-1 rounded";
      } else {
        window.isAdmin = false;
        document.getElementById("auth-btn").innerText = "Login";
        document.getElementById("auth-btn").className = "bg-blue-600 text-white px-2 py-1 rounded";
      }
      renderProducts();
    });

    const productsRef = ref(db, 'products');
    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      productsList = [];
      if (data) {
        Object.keys(data).forEach(key => {
          let item = { id: key, ...data[key] };
          if (!item.images) {
            item.images = item.image ? [item.image] : ["https://via.placeholder.com/150"];
          }
          productsList.push(item);
        });

        // តម្រៀបតាម ID/Key របស់ Firebase (Reverse) ដើម្បីឱ្យ Item បង្កើតចុងក្រោយឡើងទៅលើគេ
        productsList.sort((a, b) => b.id.localeCompare(a.id));
      }

      const isAnyUploading = Object.values(window.isUploadingMap).some(status => status === true);
      if (!isAnyUploading) {
        renderProducts();
      }
    });

    window.filterCategory = function(cat) {
      if (Object.values(window.isUploadingMap).some(s => s === true)) {
        alert("សូមរង់ចាំការ Upload រូបភាពឱ្យរួចរាល់សិន!");
        return;
      }
      window.currentCategory = cat;
      const categories = ['all', 'women', 'men', 'kids'];
      categories.forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        btn.className = (c === cat) ? "text-blue-600 underline font-bold" : "hover:text-blue-600 font-semibold";
      });
      renderProducts();
    };

    function renderProducts() {
      const container = document.getElementById("product-list");
      let htmlContent = "";

      // ១. បញ្ចូលប៊ូតុង Add (+) ទៅក្នុងផ្នែកដំបូងគេបង្អស់សម្រាប់ Admin
      if (window.isAdmin) {
        htmlContent += `
          <div onclick="addProduct()" class="bg-white p-2 rounded-xl border-2 border-dashed border-blue-400 flex flex-col items-center justify-center min-h-[180px] cursor-pointer hover:bg-blue-50 transition-colors shadow-sm">
            <span class="text-4xl text-blue-500 font-bold">+</span>
            <span class="text-xs text-blue-600 font-semibold mt-1">បន្ថែមទំនិញថ្មី</span>
          </div>
        `;
      }

      const filtered = window.currentCategory === "all" ? productsList : productsList.filter(p => p.category === window.currentCategory);

      // ២. លុប Loop HTML រួចបញ្ចូល Card តាមលំដាប់លំដោយ
      filtered.forEach((p) => {
        const images = p.images && p.images.length > 0 ? p.images : ["https://via.placeholder.com/150"];
        if (window.activeImgIndices[p.id] === undefined || window.activeImgIndices[p.id] >= images.length) {
          window.activeImgIndices[p.id] = 0;
        }
        const activeIdx = window.activeImgIndices[p.id];
        const currentImgSrc = images[activeIdx];
        const isCardUploading = window.isUploadingMap[p.id] || false;

        let thumbnailsHTML = '';
        if (images.length > 1) {
          thumbnailsHTML = `
            <div class="flex justify-center items-center gap-1 my-1 overflow-x-auto max-w-full px-1">
              ${images.map((img, idx) => `
                <div onclick="selectImage('${p.id}',${idx})" class="relative group border ${idx === activeIdx ? 'border-blue-600 scale-105' : 'border-gray-200 opacity-60'} rounded cursor-pointer transition-all">
                  <img src="${img}" class="w-6 h-7 object-cover rounded">
                  ${window.isAdmin && !isCardUploading ? `
                    <button onclick="event.stopPropagation(); deleteCardImage('${p.id}', ${idx})" class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center text-[8px] font-bold">✕</button>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          `;
        }

        htmlContent += `
          <div class="bg-white p-2 rounded-xl border relative flex flex-col items-center shadow-sm">
            ${window.isAdmin ? `<button onclick="deleteProduct('${p.id}')" ${isCardUploading ? 'disabled' : ''} class="absolute top-1 right-1 bg-red-100 text-red-500 rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs z-10 disabled:opacity-50">✕</button>` : ''}
            
            <div class="relative group cursor-pointer w-full flex flex-col items-center">
              <div class="relative w-full flex justify-center" onclick="openImageModal('${p.id}')">
                <img src="${currentImgSrc}" class="w-28 h-36 object-cover rounded-lg">
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/20 rounded-lg transition-opacity">
                  <i class="fa-solid fa-magnifying-glass-plus text-white text-lg"></i>
                </div>
              </div>

              ${images.length > 1 ? `
                <button onclick="prevImage('${p.id}',${images.length})" class="absolute left-0 top-1/2 -translate-y-1/2 bg-black/40 text-white p-1 rounded-r text-xs hover:bg-black/70">❮</button>
                <button onclick="nextImage('${p.id}',${images.length})" class="absolute right-0 top-1/2 -translate-y-1/2 bg-black/40 text-white p-1 rounded-l text-xs hover:bg-black/70">❯</button>
              ` : ''}
            </div>

            ${thumbnailsHTML}

            <div class="w-full text-xs space-y-1.5 mt-1">
              ${window.isAdmin ? `
                <div class="space-y-1 mb-1">
                  <label id="upload-label-${p.id}" class="block text-center ${isCardUploading ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'} py-1 px-2 rounded cursor-pointer text-[10px] border font-medium">
                    <i class="${isCardUploading ? 'fa-solid fa-spinner fa-spin text-amber-600' : 'fa-solid fa-plus text-blue-600'}"></i>
                    <span id="upload-text-${p.id}">${isCardUploading ? 'កំពុង Upload...' : 'បន្ថែមរូបភាព (ច្រើនរូប)...'}</span>
                    <input type="file" accept="image/*" multiple class="hidden" ${isCardUploading ? 'disabled' : ''} onchange="addImagesToCard('${p.id}', this)">
                  </label>

                  <select onchange="updateProduct('${p.id}', 'category', this.value)" class="border text-xs rounded p-0.5 w-full bg-gray-50">
                    <option value="women" ${p.category === 'women' ? 'selected' : ''}>ខោអាវនារី</option>
                    <option value="men" ${p.category === 'men' ? 'selected' : ''}>ខោអាវបុរស</option>
                    <option value="kids" ${p.category === 'kids' ? 'selected' : ''}>ខោអាវក្មេង</option>
                  </select>
                </div>
              ` : ''}

              <div class="flex items-center justify-center gap-2">
                ${window.isAdmin ? `
                  <div class="flex items-center gap-0.5"><input type="text" value="${p.price}" onchange="updateProduct('${p.id}', 'price', this.value)" class="border text-center w-12 rounded"> ៛</div>
                  <input type="text" value="${p.note}" onchange="updateProduct('${p.id}', 'note', this.value)" class="border text-center w-12 rounded">
                ` : `
                  <span class="font-bold text-sm">${p.price} ៛</span>
                  <span class="border px-1.5 py-0.5 rounded bg-gray-50 text-gray-600">${p.note}</span>
                `}
              </div>

              <div class="flex items-center justify-center gap-1.5 text-sm text-gray-700 font-medium">
                ${window.isAdmin ? `
                  <span>មាន:</span>
                  <input type="number" value="${p.stock}" onchange="updateProduct('${p.id}', 'stock', this.value)" class="border text-center w-14 rounded text-sm py-0.5">
                  <input type="text" value="${p.unit}" onchange="updateProduct('${p.id}', 'unit', this.value)" class="border text-center w-10 rounded text-sm py-0.5">
                ` : `
                  <span>មាន: ${p.stock}${p.unit}</span>
                `}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlContent;
    }

    window.selectImage = function(id, index) {
      window.activeImgIndices[id] = index;
      renderProducts();
    };

    window.nextImage = function(id, total) {
      window.activeImgIndices[id] = (window.activeImgIndices[id] + 1) % total;
      renderProducts();
    };

    window.prevImage = function(id, total) {
      window.activeImgIndices[id] = (window.activeImgIndices[id] - 1 + total) % total;
      renderProducts();
    };

    window.addImagesToCard = async function(id, inputElement) {
      const files = Array.from(inputElement.files);
      if (files.length === 0) return;

      window.isUploadingMap[id] = true;

      const uploadTextElem = document.getElementById(`upload-text-${id}`);
      const uploadLabelElem = document.getElementById(`upload-label-${id}`);

      if (uploadLabelElem) {
        uploadLabelElem.className = "block text-center bg-amber-100 text-amber-700 py-1 px-2 rounded cursor-not-allowed text-[10px] border font-medium";
      }

      const product = productsList.find(p => p.id === id);
      let currentImages = product && product.images ? [...product.images] : [];
      currentImages = currentImages.filter(img => img && !img.includes('placeholder.com'));

      for (let i = 0; i < files.length; i++) {
        if (uploadTextElem) {
          uploadTextElem.innerText = ` Upload (${i + 1}/${files.length})...`;
        }
        const file = files[i];
        
        const formData = new FormData();
        formData.append("image", file);

        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });
          const data = await res.json();

          if (data.success) {
            currentImages.push(data.data.url);
          }
        } catch (err) {
          console.error("Upload error: ", err);
        }
      }

      if (currentImages.length === 0) {
        currentImages = ["https://via.placeholder.com/150"];
      }

      window.activeImgIndices[id] = 0;
      window.isUploadingMap[id] = false;

      await update(ref(db, `products/${id}`), { images: currentImages });
      renderProducts();
    };

    window.deleteCardImage = function(id, imgIdx) {
      if (window.isUploadingMap[id]) return;
      const product = productsList.find(p => p.id === id);
      if (!product || !product.images) return;
      
      if (confirm("តើអ្នកប្រាកដថាចង់លុបរូបភាពនេះចេញមែនទេ?")) {
        let updatedImages = product.images.filter((_, idx) => idx !== imgIdx);
        if (updatedImages.length === 0) {
          updatedImages = ["https://via.placeholder.com/150"];
        }
        window.activeImgIndices[id] = 0;
        update(ref(db, `products/${id}`), { images: updatedImages });
      }
    };

    window.addProduct = function() {
      if (Object.values(window.isUploadingMap).some(s => s === true)) {
        alert("សូមរង់ចាំការ Upload រូបភាពឱ្យរួចរាល់សិន មុននឹងបន្ថែម Card ថ្មី!");
        return;
      }
      const defaultCat = window.currentCategory === "all" ? "women" : window.currentCategory;
      const newRef = push(productsRef);
      set(newRef, {
        images: ["https://via.placeholder.com/150"],
        price: "3500",
        note: "សំគាល់",
        stock: 35,
        unit: "ដុំ",
        category: defaultCat
      });
    };

    window.deleteProduct = function(id) {
      if (window.isUploadingMap[id]) {
        alert("មិនអាចលុប Card ដែលកំពុង Upload បានទេ!");
        return;
      }
      if (confirm("តើអ្នកពិតជាចង់លុបទំនិញនេះទាំងមូលមែនទេ?")) {
        remove(ref(db, `products/${id}`));
      }
    };

    window.updateProduct = function(id, field, value) {
      update(ref(db, `products/${id}`), { [field]: value });
    };

    window.handleAuthAction = function() {
      if (window.isAdmin) {
        signOut(auth).then(() => {
          alert("ចាកចេញជោគជ័យ!");
        });
      } else {
        document.getElementById("login-modal").classList.remove("hidden");
      }
    };

    window.verifyAdmin = function() {
      const email = document.getElementById("admin-email").value;
      const password = document.getElementById("admin-pass").value;

      if (!email || !password) {
        alert("សូមបញ្ចូល Email និង Password ឱ្យបានត្រឹមត្រូវ!");
        return;
      }

      const btn = document.getElementById("login-btn-submit");
      btn.innerText = "កំពុងផ្ទៀងផ្ទាត់...";

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          closeModal();
          alert("Login ជា Admin ជោគជ័យ!");
        })
        .catch((error) => {
          alert("Email ឬ ពាក្យសម្ងាត់ មិនត្រឹមត្រូវឡើយ!");
        })
        .finally(() => {
          btn.innerText = "ចូល";
        });
    };

    window.closeModal = function() {
      document.getElementById("login-modal").classList.add("hidden");
      document.getElementById("admin-email").value = "";
      document.getElementById("admin-pass").value = "";
    };

    // --- Modal Carousel Functions ---
    window.openImageModal = function(productId) {
      currentModalProductId = productId;
      currentModalImgIndex = window.activeImgIndices[productId] || 0;
      updateModalImage();
      document.getElementById("image-modal").classList.remove("hidden");
    };

    window.closeImageModal = function() {
      document.getElementById("image-modal").classList.add("hidden");
      currentModalProductId = null;
    };

    function updateModalImage() {
      const product = productsList.find(p => p.id === currentModalProductId);
      if (!product || !product.images) return;

      const images = product.images;
      const imgElem = document.getElementById("enlarged-img");
      const counterElem = document.getElementById("modal-img-counter");
      const prevBtn = document.getElementById("modal-prev-btn");
      const nextBtn = document.getElementById("modal-next-btn");

      imgElem.src = images[currentModalImgIndex];
      counterElem.innerText = `${currentModalImgIndex + 1} / ${images.length}`;

      if (images.length > 1) {
        prevBtn.classList.remove("hidden");
        nextBtn.classList.remove("hidden");
      } else {
        prevBtn.classList.add("hidden");
        nextBtn.classList.add("hidden");
      }
    }

    window.nextModalImage = function() {
      const product = productsList.find(p => p.id === currentModalProductId);
      if (!product || !product.images) return;
      currentModalImgIndex = (currentModalImgIndex + 1) % product.images.length;
      updateModalImage();
    };

    window.prevModalImage = function() {
      const product = productsList.find(p => p.id === currentModalProductId);
      if (!product || !product.images) return;
      currentModalImgIndex = (currentModalImgIndex - 1 + product.images.length) % product.images.length;
      updateModalImage();
    };

    const touchArea = document.getElementById("modal-touch-area");

    touchArea.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    touchArea.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (swipeDistance < -50) {
        window.nextModalImage();
      } else if (swipeDistance > 50) {
        window.prevModalImage();
      }
    }
  </script>
</body>
</html>
